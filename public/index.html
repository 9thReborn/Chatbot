<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mama Tee's Kitchen · Order Bot</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="chat">
      <header class="chat__header">
        <div class="chat__avatar" aria-hidden="true">🍲</div>
        <div>
          <h1>Mama Tee's Kitchen</h1>
          <p class="chat__status">Order assistant · online</p>
        </div>
      </header>

      <!-- aria-live makes screen readers announce new bot messages -->
      <section id="messages" class="chat__messages" aria-live="polite"></section>

      <form id="composer" class="chat__composer" autocomplete="off">
        <input
          id="input"
          name="message"
          inputmode="numeric"
          maxlength="3"
          placeholder="Type a number, e.g. 1"
          aria-label="Your reply"
          aria-describedby="hint"
        />
        <button type="submit">Send</button>
      </form>
      <p id="hint" class="chat__hint" role="status"></p>
    </main>
    <!-- External script (not inline) so helmet's default Content-Security-Policy allows it -->
    <script src="/app.js" defer></script>
  </body>
</html>
